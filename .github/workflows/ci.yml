name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pip install --no-deps -e backend
      - name: Install video capture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest backend/tests -q -m 'not external'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements-lock.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Check live mesh with real HTTP and browser pixels
        shell: bash
        run: |
          mkdir -p .build/browser
          export REAL2SIM_DATABASE_URL=sqlite:///.build/browser-api.sqlite
          export REAL2SIM_DATA_DIR=.build/browser-data
          export REAL2SIM_OUTPUT_DIR=.build/browser-outputs
          export REAL2SIM_STORAGE_DIR=.build/browser-artifacts
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > .build/browser/api.log 2>&1 &
          API_PID=$!
          (cd frontend && node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5176 --strictPort) > .build/browser/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5176/api/projects > /dev/null; then break; fi
            sleep 1
          done
          export CHROMIUM_PATH="$(node -p 'require("./frontend/node_modules/playwright").chromium.executablePath()')"
          REAL2SIM_TEST_WEB=http://127.0.0.1:5176 node scripts/check_live_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-fixtures-not-device-footage
          path: .build/browser
  ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Compile iOS sources without signing
        working-directory: ios/Real2SimCapture
        run: |
          xcodegen generate
          xcodebuild -project Real2SimCapture.xcodeproj -scheme Real2SimCapture -destination 'generic/platform=iOS' -derivedDataPath ../../.build/ios CODE_SIGNING_ALLOWED=NO build
