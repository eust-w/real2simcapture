name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pip install --no-deps -e backend
      - name: Install video capture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest backend/tests -q -m 'not external'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements-lock.txt --no-deps --disable-pip
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Compile iOS sources without signing
        working-directory: ios/Real2SimCapture
        run: |
          xcodegen generate
          xcodebuild -project Real2SimCapture.xcodeproj -scheme Real2SimCapture -destination 'generic/platform=iOS' -derivedDataPath ../../.build/ios CODE_SIGNING_ALLOWED=NO build
