name: real2simcapture

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${REAL2SIM_POSTGRES_DB:-real2sim}
      POSTGRES_USER: ${REAL2SIM_POSTGRES_USER:-real2sim}
      POSTGRES_PASSWORD: ${REAL2SIM_POSTGRES_PASSWORD:?Set REAL2SIM_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${REAL2SIM_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - real2sim-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REAL2SIM_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - real2sim-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${REAL2SIM_MINIO_ROOT_USER:-real2sim}
      MINIO_ROOT_PASSWORD: ${REAL2SIM_MINIO_ROOT_PASSWORD:?Set REAL2SIM_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${REAL2SIM_MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${REAL2SIM_MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - real2sim-minio:/data

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${REAL2SIM_MINIO_ROOT_USER:-real2sim}
      MINIO_ROOT_PASSWORD: ${REAL2SIM_MINIO_ROOT_PASSWORD:?Set REAL2SIM_MINIO_ROOT_PASSWORD}
      REAL2SIM_S3_BUCKET: ${REAL2SIM_S3_BUCKET:-real2sim-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${REAL2SIM_S3_BUCKET}"
        mc anonymous set private "local/$${REAL2SIM_S3_BUCKET}"

volumes:
  real2sim-postgres:
  real2sim-redis:
  real2sim-minio:
